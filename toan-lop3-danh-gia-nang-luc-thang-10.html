<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toán lớp 3 – Đánh giá năng lực tháng 10</title>
<style>
:root{--bg:#fff8e7;--card:#ffffff;--ink:#2b2d42;--muted:#6b6f85;--blue:#3b82f6;--blue-d:#1d4ed8;--green:#16a34a;--green-bg:#e8f9ee;--red:#dc2626;--red-bg:#fdeaea;--yellow:#ffd166;--line:#e6e1d3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1d2a;--card:#262a3d;--ink:#f1f2f8;--muted:#a9adc4;--green-bg:#173a27;--red-bg:#44201f;--line:#3a3f58}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px}
header.top{background:linear-gradient(135deg,#4f9dff,#7c5cff);color:#fff;border-radius:22px;padding:18px 16px 16px;text-align:center;position:relative;margin-bottom:12px}
header.top h1{margin:0;font-size:1.35rem;line-height:1.25}
header.top p{margin:4px 0 0;opacity:.95;font-size:.95rem}
.deco{font-size:1.6rem;letter-spacing:6px;margin-bottom:2px}
#sound{position:absolute;top:10px;right:10px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:1.3rem;width:44px;height:44px;border-radius:50%;cursor:pointer}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.prog{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#16a34a);border-radius:99px;transition:width .35s}
.prog-t{font-size:.85rem;color:var(--muted);text-align:right;margin-top:2px}
.info{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.info label{display:block;font-weight:700;margin:6px 0 4px}
.info input,.info select{width:100%;font-size:1.05rem;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit}
.info input[readonly]{opacity:.8;background:var(--line)}
.err{color:var(--red);font-weight:700;font-size:.95rem;margin-top:6px;min-height:1px}
.q{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;transition:background .25s,border-color .25s}
.q.ok{border-color:var(--green);background:var(--green-bg)}
.q.bad{border-color:var(--red);background:var(--red-bg)}
.qh{display:inline-block;background:var(--yellow);color:#4a3b00;font-weight:800;border-radius:99px;padding:2px 12px;font-size:.95rem;margin-bottom:6px}
.qt{margin:0 0 8px;font-weight:600}
.seq{font-size:1.35rem;font-weight:800;text-align:center;background:var(--bg);border-radius:12px;padding:8px;margin:0 0 8px;letter-spacing:1px}
.q img{display:block;max-width:100%;height:auto;margin:6px auto 10px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 10px;font:inherit;font-size:1.05rem;font-weight:600;text-align:left;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.97)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.opt.right{background:#c9f2d6;border-color:var(--green);color:#064e1f}
.opt.right b{background:var(--green)}
.opt.wrong{background:#ffd3d3;border-color:var(--red);color:#7a1010}
.opt.wrong b{background:var(--red)}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:10px}
.q.ok .fb,.q.bad .fb{display:block;animation:pop .3s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.verdict{font-weight:800;font-size:1.1rem}
.q.ok .verdict{color:var(--green)}
.q.bad .verdict{color:var(--red)}
.ans{margin:4px 0;font-weight:700}
.exp{font-size:.98rem;color:var(--ink);background:rgba(127,127,127,.12);border-radius:12px;padding:8px 10px;margin-top:6px}
.exp img{max-width:140px}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#34d399,#16a34a);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0f7a36}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0f7a36}
.btn.alt{background:linear-gradient(135deg,#4f9dff,#7c5cff);box-shadow:0 4px 0 #3a3fb0;margin-top:10px}
.result{display:none;text-align:center;background:var(--card);border:3px solid var(--blue);border-radius:22px;padding:18px 14px;margin-top:14px}
.result .score{font-size:2.4rem;font-weight:900;color:var(--blue-d)}
@media (prefers-color-scheme:dark){.result .score{color:#9ec2ff}}
.result .sent{margin:8px 0;font-weight:700}
.result .sent.fail{color:var(--red)}
.result .wrongs{font-size:.95rem;color:var(--muted)}
.confetti{position:fixed;pointer-events:none;font-size:1.6rem;z-index:50;animation:fly 1.1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button id="sound" type="button" aria-label="Bật hoặc tắt âm thanh">🔊</button>
    <div class="deco">🧮✏️⭐</div>
    <h1>Đề đánh giá năng lực tháng 10</h1>
    <p>Môn Toán – Lớp 3</p>
  </header>

  <div class="sticky">
    <div class="prog"><i id="bar"></i></div>
    <div class="prog-t" id="progText">Đã làm 0/20 câu</div>
  </div>

  <div class="info">
    <label for="lop">Lớp</label>
    <input id="lop" type="text" placeholder="Ví dụ: 3A1" autocomplete="off">
    <div id="nameBox">
      <label for="hoten">Họ và tên</label>
      <input id="hoten" type="text" placeholder="Gõ họ và tên của con" autocomplete="off">
    </div>
    <div class="err" id="infoErr"></div>
  </div>

  <div id="quiz"></div>

  <button class="btn" id="submit" type="button">📨 Nộp bài</button>

  <div class="result" id="result">
    <div id="emoji" style="font-size:2.4rem">🎉</div>
    <div class="score" id="scoreText"></div>
    <div id="praise" style="font-weight:700"></div>
    <div class="wrongs" id="wrongs"></div>
    <div class="sent" id="sent"></div>
    <button class="btn alt" id="retry" type="button" style="display:none">🔁 Gửi lại bài</button>
    <button class="btn alt" id="again" type="button">🔄 Làm lại từ đầu</button>
  </div>
</div>

const QUESTIONS = [{"t": "Số “Ba trăm năm mươi tư” viết là:", "o": ["350", "354", "325", "345"], "a": 1, "e": "Số “Ba trăm năm mươi tư” viết là 354.", "label": "Câu 1"}, {"t": "Tính: 9 × 5 = ?", "o": ["45", "35", "55", "15"], "a": 0, "e": "9 × 5 = 45.", "label": "Câu 2"}, {"t": "Điền số thích hợp vào chỗ chấm: 248 = … + 123", "o": ["135", "213", "125", "321"], "a": 2, "e": "248 = 125 + 123.", "label": "Câu 3"}, {"t": "32 : 4 = ?", "o": ["7", "8", "9", "6"], "a": 1, "e": "32 : 4 = 8.", "label": "Câu 4"}, {"t": "Con trâu cân nặng 560 kg, con nghé cân nặng 140 kg. Hỏi con trâu nặng hơn con nghé bao nhiêu ki-lô-gam?", "o": ["360", "320", "430", "420"], "a": 3, "e": "Con trâu nặng hơn con nghé số ki-lô-gam là: 560 – 140 = 420 (kg).", "label": "Câu 5"}, {"t": "Cô giáo có 14 quyển vở chia đều cho Hòa và Quân. Hỏi mỗi bạn được mấy quyển vở?", "o": ["9", "8", "7", "6"], "a": 2, "e": "Mỗi bạn được số quyển vở là: 14 : 2 = 7 (quyển vở).", "label": "Câu 6"}, {"t": "Lan làm một chú hạc giấy hết 3 phút. Hỏi bạn làm 6 chú hạc giấy như thế trong mấy phút?", "o": ["18", "21", "15", "24"], "a": 0, "e": "Lan làm 6 chú hạc giấy như thế trong số phút là: 3 × 6 = 18 (phút).", "label": "Câu 7"}, {"t": "Điền số thích hợp vào chỗ chấm: 600 mm = … cm", "o": ["6", "60", "600", "6000"], "a": 1, "e": "600 mm = 60 cm.", "label": "Câu 8"}, {"t": "Quãng đường ngắn nhất từ nhà Ngân đến sân tập thể dục dài bao nhiêu mét?", "img": "q9", "alt": "Sơ đồ hai con đường từ nhà Ngân đến sân tập thể dục", "o": ["395 m", "367 m", "677 m", "742 m"], "a": 2, "e": "Có hai con đường. Đường thứ nhất dài: 395 + 282 = 677 (m). Đường thứ hai dài: 375 + 367 = 742 (m). Vì 677 m < 742 m nên đường ngắn nhất dài 677 m.", "label": "Câu 9"}, {"t": "Tính độ dài đường gấp khúc sau đây:", "img": "q10", "alt": "Đường gấp khúc ABCD, AB dài 15 cm, BC dài 9 cm, CD dài 12 cm", "o": ["36 cm", "46 cm", "56 cm", "66 cm"], "a": 0, "e": "Độ dài đường gấp khúc ABCD là: 15 + 9 + 12 = 36 (cm).", "label": "Câu 10"}, {"t": "Tìm hai số tiếp t – 33 = 7. Thay vào hàng 1: hình tròn = 33 – 7 = 26.", "label": "Câu 17"}, {"t": "Bác An cưa một thanh gỗ thành 6 đoạn. Mỗi lần cưa, bác cưa hết 6 phút. Hỏi để cưa cả thanh gỗ bác cần dùng bao nhiêu phút?", "o": ["36", "30", "24", "18"], "a": 1, "e": "Để cưa thanh gỗ làm 6 đoạn, bác An cần: 6 – 1 = 5 (lượt cưa). Thời gian cưa là: 6 × 5 = 30 (phút).", "label": "Câu 18"}, {"t": "Hồng muốn biết sinh nhật của mình 15 tháng 6 là thứ mấy. Bạn Mai cho biết ngày 7 tháng 6 là thứ Ba. Hỏi sinh nhật Hồng vào thứ mấy?", "o": ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm"], "a": 2, "e": "Một tuần có 7 ngày. Thứ Ba tiếp theo là ngày 7 + 7 = 14. Do ngày 14 là thứ Ba nên ngày 15 tháng 6 là thứ Tư.", "label": "Câu 19"}, {"t": "Hai lớp 3A và 3B được đi thăm đền Cổ Loa, dự định mỗi lớp một đoàn. Để chia thành hai đoàn có số người bằng nhau, cô giáo chuyển 8 bạn nữ ở lớp 3A sang lớp 3B và chuyển 5 bạn nam ở lớp 3B sang lớp 3A. Lúc này mỗi đoàn có 30 bạn. Hỏi số học sinh đi tham quan của lớp 3A nhiều hơn lớp 3B bao nhiêu?", "o": ["6 học sinh", "3 học sinh", "10 học sinh", "12 học sinh"], "a": 0, "e": "Lớp 3A ban đầu có: 30 + 8 – 5 = 33 (học sinh). Lớp 3B ban đầu có: 30 – 8 + 5 = 27 (học sinh). Lớp 3A nhiều hơn lớp 3B: 33 – 27 = 6 (học sinh).", "label": "Câu 20"}];

const LET = ['A','B','C','D'];
const GOOD = ['Đúng rồi! Con giỏi quá! 🌟','Chính xác! Tuyệt vời! 🎉','Giỏi lắm! Cứ thế phát huy nhé! 👏','Đúng rồi! Con làm rất tốt! 💪','Xuất sắc! Con thật thông minh! ⭐'];
const BAD = ['Chưa đúng, không sao đâu con! 💛','Tiếc quá, lần sau con sẽ làm được! 🌈','Chưa đúng rồi, con xem đáp án nhé! 🙂','Cố lên con, xem lại cách giải nhé! 💪'];
let state, soundOn = true, actx = null, submitted = false, lastPayload = null;

function resetState(){ state = QUESTIONS.map(() => ({ choice: -1, done: false, ok: false })); }
resetState();

/* ---------- Âm thanh ---------- */
function ctx(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
  return actx;
}
function tone(freq, start, dur, type, vol){
  const c = ctx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playOk(){ if(!soundOn) return; tone(988, 0, 0.18, 'sine', 0.25); tone(1319, 0.14, 0.28, 'sine', 0.25); }
function playBad(){ if(!soundOn) return; tone(196, 0, 0.22, 'triangle', 0.18); tone(165, 0.15, 0.28, 'triangle', 0.16); }
document.getElementById('sound').addEventListener('click', function(){
  soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇';
  if(soundOn){ ctx(); playOk(); }
});

function burst(el){
  const r = el.getBoundingClientRect();
  const em = ['⭐','🎉','✨','🌟'];
  for(let i = 0; i < 8; i++){
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    s.style.setProperty('--dy', (-40 - Math.random() * 90) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const box = document.getElementById('quiz'); box.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const d = document.createElement('div'); d.className = 'q'; d.id = 'q' + i;
    let h = '<span class="qh">' + q.label + '</span><p class="qt"></p>';
    if(q.seq) h += '<div class="seq"></div>';
    if(q.img) h += '<img src="' + IMGS[q.img] + '" alt="">';
    h += '<div class="opts">';
    q.o.forEach((t, k) => { h += '<button type="button" class="opt" data-k="' + k + '"><b>' + LET[k] + '</b><span></span></button>'; });
    h += '</div><div class="fb"><div class="verdict"></div><div class="ans"></div><div class="exp"></div></div>';
    d.innerHTML = h;
    d.querySelector('.qt').textContent = q.t;
    if(q.seq) d.querySelector('.seq').textContent = q.seq;
    if(q.img) d.querySelector('img').alt = q.alt || '';
    d.querySelectorAll('.opt').forEach((b, k) => {
      b.querySelector('span').textContent = q.o[k];
      b.addEventListener('click', () => answer(i, k, true));
    });
    box.appendChild(d);
  });
}

function answer(i, k, fromTap){
  const s = state[i]; if(s.done) return;
  const q = QUESTIONS[i];
  s.done = true; s.choice = k; s.ok = (k === q.a);
  const d = document.getElementById('q' + i);
  d.classList.add(s.ok ? 'ok' : 'bad');
  d.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if(idx === q.a) b.classList.add('right');
    else if(idx === k) b.classList.add('wrong');
  });
  const v = d.querySelector('.verdict');
  if(k < 0) v.textContent = 'Con chưa làm câu này 🙂';
  else v.textContent = s.ok ? GOOD[i % GOOD.length] : BAD[i % BAD.length];
  d.querySelector('.ans').textContent = 'Đáp án đúng: ' + LET[q.a] + '. ' + q.o[q.a];
  const ex = d.querySelector('.exp'); ex.textContent = 'Giải thích: ' + q.e;
  if(q.eimg){ const im = document.createElement('img'); im.src = IMGS[q.eimg]; im.alt = 'Hình minh họa lời giải'; ex.appendChild(im); }
  if(fromTap){
    if(s.ok){ playOk(); burst(d.querySelector('.opt.right')); } else playBad();
  }
  updateProg();
}

function updateProg(){
  const n = state.filter(s => s.done && s.choice >= 0).length;
  document.getElementById('bar').style.width = (n / QUESTIONS.length * 100) + '%';
  document.getElementById('progText').textContent = 'Đã làm ' + n + '/' + QUESTIONS.length + ' câu';
}

/* ---------- Ô Lớp và Họ tên ---------- */
const lopEl = document.getElementById('lop');
function setupRoster(){
  if(!LOP_LINK) return;
  lopEl.value = LOP_LINK; lopEl.readOnly = true;
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => { if(ctrl) ctrl.abort(); }, 5000);
  fetch(GAS_URL + '?action=roster&lop=' + encodeURIComponent(LOP_LINK), ctrl ? { signal: ctrl.signal } : {})
    .then(r => r.json())
    .then(d => {
      clearTimeout(timer);
      if(d && d.ok && d.names && d.names.length) showRoster(d.names);
    })
    .catch(() => { clearTimeout(timer); });
}
function showRoster(names){
  const box = document.getElementById('nameBox');
  const typed = document.getElementById('hoten').value;
  box.innerHTML = '<label for="rosterSel">Chọn tên của con</label><select id="rosterSel"></select>' +
    '<input id="hoten" type="text" placeholder="Gõ họ và tên của con" autocomplete="off" style="display:none;margin-top:8px">';
  const sel = document.getElementById('rosterSel');
  const o0 = new Option('— Chạm để chọn tên —', ''); sel.add(o0);
  names.forEach(n => sel.add(new Option(n, n)));
  sel.add(new Option('Tên con không có trong danh sách', '__other'));
  const inp = document.getElementById('hoten'); inp.value = typed;
  sel.addEventListener('change', () => {
    if(sel.value === '__other'){ inp.style.display = 'block'; inp.focus(); }
    else { inp.style.display = 'none'; inp.value = sel.value; }
  });
}
function getName(){
  const sel = document.getElementById('rosterSel');
  const inp = document.getElementById('hoten');
  if(sel && sel.value && sel.value !== '__other') return sel.value.trim();
  return (inp.value || '').trim();
}

/* ---------- Nộp bài ---------- */
function finish(){
  if(submitted) return;
  const name = getName(), lop = lopEl.value.trim();
  const err = document.getElementById('infoErr');
  if(!name || !lop){
    err.textContent = !name && !lop ? 'Con nhớ điền Lớp và Họ tên trước khi nộp nhé!' : (!name ? 'Con nhớ chọn hoặc gõ Họ và tên nhé!' : 'Con nhớ điền Lớp nhé!');
    document.querySelector('.info').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  err.textContent = '';
  submitted = true;
  state.forEach((s, i) => { if(!s.done) answer(i, -1, false); });
  const score = state.filter(s => s.ok).length;
  const wrong = [];
  state.forEach((s, i) => { if(!s.ok) wrong.push(QUESTIONS[i].label); });
  document.getElementById('submit').style.display = 'none';
  const r = document.getElementById('result'); r.style.display = 'block';
  document.getElementById('scoreText').textContent = score + '/' + QUESTIONS.length + ' câu đúng';
  const p = score === QUESTIONS.length ? ['🏆', 'Tuyệt đối! Con đúng hết rồi!'] : score >= 16 ? ['🎉', 'Rất giỏi! Con làm bài rất tốt!'] : score >= 10 ? ['😊', 'Khá lắm! Con xem lại các câu sai nhé!'] : ['💪', 'Con cố gắng thêm nhé, xem lại các lời giải nha!'];
  document.getElementById('emoji').textContent = p[0];
  document.getElementById('praise').textContent = p[1];
  document.getElementById('wrongs').textContent = wrong.length ? 'Các câu cần xem lại: ' + wrong.join(', ') : '';
  if(score === QUESTIONS.length){ playOk(); burst(document.getElementById('emoji')); }
  lastPayload = { bai: BAI, hoten: name, lop: lop, loplink: LOP_LINK, diem: score, tongdiem: QUESTIONS.length, causai: wrong.join(', ') };
  sendScore();
  r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function sendScore(){
  const sent = document.getElementById('sent'), retry = document.getElementById('retry');
  sent.className = 'sent'; sent.textContent = 'Đang gửi điểm cho cô…'; retry.style.display = 'none';
  fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(lastPayload) })
    .then(() => { sent.textContent = '✅ Đã gửi bài cho cô giáo!'; })
    .catch(() => { sent.className = 'sent fail'; sent.textContent = 'Chưa gửi được bài. Con kiểm tra mạng rồi bấm gửi lại nhé.'; retry.style.display = 'block'; });
}
document.getElementById('submit').addEventListener('click', () => { ctx(); finish(); });
document.getElementById('retry').addEventListener('click', sendScore);
document.getElementById('again').addEventListener('click', () => {
  submitted = false; resetState(); build(); updateProg();
  document.getElementById('result').style.display = 'none';
  document.getElementById('submit').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

build(); updateProg(); setupRoster();
</script>
